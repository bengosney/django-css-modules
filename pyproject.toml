[build-system]
build-backend = "maturin"
requires = [ "maturin>=1.7,<2" ]

[project]
name = "django-css-modules"
version = "0.0.1"
description = "CSS Modules for Django templates, powered by Lightning CSS"
readme = "README.md"
authors = [ { name = "Ben Gosney", email = "bengosney@googlemail.com" } ]
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [ "django>=4.2" ]
optional-dependencies.dev = [ "icecream", "maturin>=1.7", "pre-commit", "ruff" ]
optional-dependencies.test = [ "pytest", "pytest-django" ]

[tool.maturin]
module-name = "django_css_modules._lightningcss_rs"
python-source = "."
features = [ "pyo3/extension-module" ]

[tool.ruff]
target-version = "py314"
line-length = 120
lint.select = [ "C90", "DJ", "E4", "E7", "E9", "F", "N", "UP" ]

[tool.pytest]
ini_options.pythonpath = [ "." ]
ini_options.python_files = [ "test_*.py" ]
ini_options.DJANGO_SETTINGS_MODULE = "tests.settings"
