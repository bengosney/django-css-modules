[package]
name = "lightningcss-django"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "_lightningcss_rs"
crate-type = ["cdylib"]

[dependencies]
lightningcss = { version = "1.0.0-alpha.72", features = ["browserslist"] }
pyo3 = { version = "0.29.2", features = ["extension-module", "abi3-py310"] }
